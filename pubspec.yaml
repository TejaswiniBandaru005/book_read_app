name: book_reader_app
description: A comprehensive book reader app for PDF and EPUB files
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # PDF Reading
  syncfusion_flutter_pdfviewer: ^21.2.10
  
  # EPUB Reading
  epub_view: ^3.0.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # State Management
  provider: ^6.0.5
  
  # UI/UX
  google_fonts: ^5.1.0
  cupertino_icons: ^1.0.2
  
  # File operations
  file_picker: ^5.3.2
  path_provider: ^2.1.0
  path: ^1.8.3
  
  # Utilities
  shared_preferences: ^2.2.0
  uuid: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  build_runner: ^2.4.6
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/books/
    - assets/images/